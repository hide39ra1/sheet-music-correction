<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>譜面補正</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0eb;color:#202a25;font:15px system-ui,sans-serif}header{background:#18352d;color:#fff;padding:28px max(20px,5vw)}h1{margin:0;font-size:34px}p{line-height:1.55}main{max-width:1400px;margin:auto;padding:24px}.bar,.card,aside{background:white;border:1px solid #d7dfd8;border-radius:12px;padding:16px}.bar,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,.pick{font:inherit;padding:8px 13px;border:1px solid #9caca4;border-radius:7px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{background:#235745;color:white;border-color:#235745}.pick input{position:absolute;opacity:0;width:1px}.pick:focus-within{outline:2px solid}#workspace{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;margin-top:16px}#workspace[hidden]{display:none}aside{max-height:75vh;overflow:auto}aside button{display:block;width:100%;margin-bottom:7px;text-align:left;overflow-wrap:anywhere}aside button[aria-current=true]{background:#dcece3;border-color:#235745}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}figure{margin:0;min-width:0}figcaption{margin-bottom:6px;font-weight:600}canvas{width:100%;display:block;border:1px solid #d7dfd8;background:white}.card h2{margin-top:0;overflow-wrap:anywhere}input[type=number]{width:76px;font:inherit}#status{min-height:1.5em;overflow-wrap:anywhere}@media(max-width:700px){main{padding:12px}#workspace{grid-template-columns:minmax(0,1fr)}aside{max-height:160px}}

body{background:#eef1ed}header{position:sticky;top:0;z-index:3;padding:12px 24px;box-shadow:0 2px 10px #10291e30}
h1{font-size:22px;margin-right:auto}.bar{background:transparent;border:0;padding:0}.pick{color:#18352d}
#status{margin:8px 0 0;font-size:13px;color:#e0eee5}progress{height:7px}
main{max-width:1700px}#workspace{grid-template-columns:205px minmax(0,1fr) 280px;align-items:start}
aside{max-height:none}.page-button{display:flex;gap:8px;align-items:center}.page-button img{width:40px;border:1px solid #d7dfd8}.page-button span{min-width:0}
.page-button small{display:block;color:#455b50}.panel fieldset{margin:12px 0;padding:10px;border:1px solid #d7dfd8;border-radius:8px}.panel .actions{gap:7px}
.panel input[type=number]{width:56px}.panel p{font-size:13px}.viewer{min-width:0}.views{grid-template-columns:minmax(0,1fr)}
.views[data-mode=split]{grid-template-columns:repeat(2,minmax(0,1fr))}
.views[data-mode=after] #original,.views[data-mode=overlay] #original{display:none}
#comparison{overflow:auto;max-height:78vh;background:#e0e6df;padding:12px;margin-top:12px;border-radius:8px}
.views{margin:0}canvas{border:0}.sheet{position:relative}.sheet canvas+canvas{position:absolute;inset:0;background:transparent;touch-action:pan-y}
.viewer nav{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #d7dfd8}
#margins{margin:12px 0 0;border:1px solid #d7dfd8;border-radius:8px}
#margins p{margin:0;font-size:13px}
#shortcuts{max-width:min(90vw,420px);border:1px solid #9caca4;border-radius:12px;color:#202a25;padding:20px}
#shortcuts::backdrop{background:#10291e88}#shortcuts h2{margin-top:0}#shortcuts dl{display:grid;grid-template-columns:auto 1fr;gap:8px 20px}#shortcuts dd{margin:0}#help{color:#18352d}
#handles.editing{touch-action:none;cursor:crosshair}
@media(max-width:1050px){#workspace{grid-template-columns:155px minmax(0,1fr)}.panel{grid-column:2}}
@media(max-width:700px){header{padding:10px 12px}#workspace{grid-template-columns:minmax(0,1fr)}.panel{grid-column:auto}aside{max-height:160px}}
</style>
<header>
<div class="bar"><h1>譜面補正</h1>
<label class="pick">PDFを選ぶ<input id="pdf" type="file" accept=".pdf"></label>
<label class="pick">画像フォルダを選ぶ<input id="folder" type="file" webkitdirectory multiple></label>
<button id="save" class="primary" disabled>補正結果を保存</button>
<button id="help" aria-keyshortcuts="Shift+/" aria-haspopup="dialog">キー操作</button>
</div>
<p id="status" role="status">PDF、または JPEG・PNG・TIFF・BMP・WebP の画像フォルダを選択してください。</p>
<progress id="progress" aria-label="傾き検出の進捗" style="width:100%;accent-color:#235745" hidden></progress>
<button id="cancelLoad" hidden>読み込みを中止</button>
</header>
<main>
<div id="dropZone" style="border:2px dashed #658477;border-radius:12px;padding:20px;text-align:center;background:#fff;margin-bottom:16px">
PDFをここにドラッグ＆ドロップ
</div>
<section id="workspace" hidden>
<aside aria-label="ページ一覧">
<div id="pages"></div>
</aside>
<div class="card viewer">
<nav class="actions" aria-label="ページ送り">
<button id="prev">前へ</button><span id="position"></span><button id="next">次へ</button>
</nav>
<div class="actions">
<label>表示 <select id="mode">
<option value="after">補正後</option>
<option value="split">補正前後</option>
<option value="overlay">重ねて比較</option>
</select></label>
<label id="opacityControl" hidden>補正前の濃さ <input id="opacity" type="range" min="0" max="100" value="50"></label>
<label><input id="guide" type="checkbox"> 水平ガイド</label>
<label>表示倍率 <select id="zoom">
<option value="1">全体</option><option value="1.5">150%</option>
<option value="2">200%</option><option value="3">300%</option>
</select></label>
<label><input id="editEdges" type="checkbox"> 端の白塗りを調整</label>
</div>
<fieldset id="margins" hidden>
<legend>表示向きで画像の端を白くする（%）</legend>
<div class="actions">
<label>上 <input type="number" min="0" max="20" step="0.1" value="0"></label>
<label>右 <input type="number" min="0" max="20" step="0.1" value="0"></label>
<label>下 <input type="number" min="0" max="20" step="0.1" value="0"></label>
<label>左 <input type="number" min="0" max="20" step="0.1" value="0"></label>
<p>画像の端付近を内側へドラッグするか、幅を入力してください。</p>
<button id="applyMargins">この幅を全ページに適用</button>
</div>
</fieldset>
<div id="comparison" tabindex="0" aria-label="補正前後の比較">
<div class="views" id="views" data-mode="after">
<figure id="original"><figcaption>補正前</figcaption><canvas id="before" aria-label="補正前の譜面"></canvas></figure>
<figure><figcaption id="caption">補正後</figcaption><div class="sheet">
<canvas id="after" aria-label="補正後の譜面"></canvas><canvas id="handles" aria-hidden="true"></canvas>
</div></figure>
</div></div></div>
<div class="card panel">
<h2 id="title"></h2>
<div class="actions">
<button id="less" aria-label="角度を0.1度減らす">−0.1°</button>
<label>角度 <input id="angle" type="number" min="-15" max="15" step="0.05"> °</label>
<button id="more" aria-label="角度を0.1度増やす">+0.1°</button>
<label><input id="flip" type="checkbox"> 180°回転</label>
<button id="reset">このページを初期設定に戻す</button>
</div>
<p id="detection"></p>
<div class="actions">
<label><input id="fit" type="checkbox" checked> 縮小して端の欠けを防ぐ</label>
<button id="even">全ページを奇数正常・偶数反転に戻す</button>
</div>

</div></section>
</main>
<dialog id="shortcuts" aria-labelledby="shortcutTitle">
<h2 id="shortcutTitle">キー操作</h2>
<dl>
<dt><kbd>←</kbd> / <kbd>→</kbd></dt><dd>前 / 次のページ</dd>
<dt><kbd>[</kbd> / <kbd>]</kbd></dt><dd>角度を −0.1° / +0.1°</dd>
<dt><kbd>R</kbd></dt><dd>180°回転を切り替え</dd>
<dt><kbd>G</kbd></dt><dd>水平ガイドを切り替え</dd>
<dt><kbd>M</kbd></dt><dd>端の白塗り調整を開閉</dd>
<dt><kbd>1</kbd> / <kbd>2</kbd> / <kbd>3</kbd></dt><dd>補正後 / 前後 / 重ね表示</dd>
<dt><kbd>−</kbd> / <kbd>+</kbd></dt><dd>縮小 / 拡大</dd>
<dt><kbd>?</kbd></dt><dd>この一覧を開く</dd>
</dl>
<form method="dialog"><button autofocus>閉じる</button></form>
</dialog>
<script>
const ui = Object.fromEntries(Array.from(document.querySelectorAll('[id]'), e => [e.id,e]));
const collator = new Intl.Collator('ja', {numeric:true});
const marginInputs = Array.from(ui.margins.querySelectorAll('input'));
let sources = [], pages = [], active = 0, isPdf = false, ready = false;
let drag = null;
const path = file => file.webkitRelativePath || file.name;
const extension = file => '.' + file.name.split('.').pop().toLowerCase();

let loading;
async function api(route, file, settings, signal) {
  const headers = {'X-Format': extension(file)};
  if (route === '/analyse') headers.Accept = 'application/x-ndjson';
  if (settings) headers['X-Settings'] = JSON.stringify(settings);
  const response = await fetch(route, {method:'POST', headers, body:file, signal});
  if (!response.ok) {
    const error = await response.json().catch(() => ({}));
    throw new Error(error.error || '処理に失敗しました (' + response.status + ')');
  }
  return response;
}
async function* analysisRecords(response) {
  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  let pending = '';
  try {
    while (true) {
      const {done,value} = await reader.read();
      if (done) break;
      pending += value;
      const lines = pending.split('\n');
      pending = lines.pop();
      for (const line of lines) yield JSON.parse(line);
    }
    if (pending) throw new Error('検出結果の受信が途中で終了しました。');
  } finally {
    await reader.cancel();
  }
}
function busy(value) {
  ui.pdf.disabled = ui.folder.disabled = value;
  ui.save.disabled = value || !ready;
  ui.applyMargins.disabled = value || !ready;
}
async function load(files, pdf) {
  if (!files.length) return;
  const previous = {sources,pages,active,isPdf,ready,fit:ui.fit.checked};
  loading = new AbortController();
  pages = []; ready = false; ui.workspace.hidden = true; busy(true);
  ui.cancelLoad.hidden = false;
  ui.fit.checked = true;
  ui.progress.hidden = false;
  ui.progress.removeAttribute('value');
  ui.status.textContent = 'ファイルを読み込んでいます…';
  try {
    isPdf = pdf;
    sources = files.filter(f => pdf || /\.(png|jpe?g|tiff?|bmp|webp)$/i.test(f.name))
      .sort((a,b) => collator.compare(path(a),path(b)));
    if (!sources.length) throw new Error('対応形式の画像がありません。');
    const result = pages;
    let total = pdf ? 0 : sources.length;
    function showProgress() {
      ui.progress.max = total;
      ui.progress.value = result.length;
      const percent = Math.floor(result.length * 100 / total);
      ui.status.textContent = '傾き検出中 · ' + result.length + ' / ' + total + 'ページ完了（' + percent + '%）';
    }
    if (total) showProgress();
    for (const file of sources) {
      const before = result.length;
      for await (const info of analysisRecords(await api('/analyse',file,undefined,loading.signal))) {
        if (info.error) throw new Error(info.error);
        if (info.total !== undefined) {
          if (pdf) total = info.total;
          showProgress();
          continue;
        }
        const image = new Image();
        image.src = 'data:image/jpeg;base64,' + info.preview;
        await image.decode();
        loading.signal.throwIfAborted();
        const index = result.length;
        result.push({image, detected:info.angle, angle:info.angle ?? 0, flip:index % 2 === 1, margins:[0,0,0,0],
          name:pdf ? (index+1) + 'ページ' : path(file)});
        showProgress();
        if (index === 0) { ui.workspace.hidden = false; select(0); }
        else renderPages();
      }
      if (result.length - before !== (pdf ? total : 1) || !total) {
        throw new Error('一部のページの検出結果を受信できませんでした。');
      }
    }
    ready = true;
    ui.status.textContent = (pdf ? sources[0].name + ' · ' : '') + pages.length + 'ページを読み込みました。';
  } catch (error) {
    ({sources,pages,active,isPdf,ready} = previous);
    ui.fit.checked = previous.fit;
    ui.workspace.hidden = !pages.length;
    if (pages.length) select(active);
    ui.status.textContent = loading.signal.aborted ? '読み込みを中止しました。' : error.message;
  } finally {
    loading = undefined;
    ui.cancelLoad.hidden = true;
    ui.progress.hidden = true;
    busy(false); ui.pdf.value = ui.folder.value = '';
  }
}
function renderPages() {
  const entries = pages.flatMap((page,index) => {
    const button = document.createElement('button');
    button.className = 'page-button';
    button.setAttribute('aria-current', index === active);
    const thumb = document.createElement('img');
    thumb.src = page.thumbnail ??= thumbnail(page); thumb.alt = ''; thumb.loading = 'lazy';
    const text = document.createElement('span');
    text.textContent = page.name;
    const badges = document.createElement('small');
    badges.textContent = [page.flip && '180°', page.detected === null && '傾き要確認'].filter(Boolean).join(' · ');
    text.append(badges); button.append(thumb,text);
    button.onclick = () => select(index);
    return [button];
  });
  ui.prev.disabled = nextIndex(-1) === -1;
  ui.next.disabled = nextIndex(1) === -1;
  ui.position.textContent = (active+1) + ' / ' + pages.length + 'ページ';
  ui.pages.replaceChildren(...entries);
}
function orientedMargins(page) {
  const [top,right,bottom,left] = page.margins;
  return page.flip ? [bottom,left,top,right] : [top,right,bottom,left];
}
function marginIndex(index, page) { return (index + (page.flip ? 2 : 0)) % 4; }
function select(index) {
  drag = null;
  if (active !== index) ui.comparison.scrollTo(0,0);
  active = index;
  const page = pages[index];
  renderPages();
  ui.title.textContent = page.name;
  ui.angle.value = page.angle; ui.flip.checked = page.flip;
  marginInputs.forEach((input,i) => { input.value = orientedMargins(page)[i]; });
  ui.detection.textContent = page.detected === null
    ? '傾きを検出できませんでした。必要に応じて角度を調整してください。'
    : '検出した補正角度 ' + page.detected.toFixed(2) + '°';
  draw();
}
function paint(canvas,page,w,h) {
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'white'; ctx.fillRect(0,0,w,h);
  ctx.translate(w/2,h/2);
  const rad = -page.angle * Math.PI / 180;
  if (ui.fit.checked) {
    const c = Math.abs(Math.cos(rad)), s = Math.abs(Math.sin(rad));
    const scale = Math.min(w/(w*c+h*s),h/(w*s+h*c),1);
    ctx.scale(scale,scale);
  }
  ctx.rotate(rad + (page.flip ? Math.PI : 0));
  ctx.drawImage(page.image,-w/2,-h/2,w,h);
  const [top,right,bottom,left] = page.margins.map((value,i) => value*(i%2 ? w : h)/100);
  ctx.fillRect(-w/2,-h/2,w,top);
  ctx.fillRect(w/2-right,-h/2,right,h);
  ctx.fillRect(-w/2,h/2-bottom,w,bottom);
  ctx.fillRect(-w/2,-h/2,left,h);
  return ctx;
}
function thumbnail(page) {
  const canvas = document.createElement('canvas');
  paint(canvas,page,80,Math.max(1,Math.round(page.image.height*80/page.image.width)));
  return canvas.toDataURL('image/jpeg',0.8);
}
function nextIndex(step) {
  const next = active + step;
  return next >= 0 && next < pages.length ? next : -1;
}
function changed(page = pages[active]) {
  delete page.thumbnail;
  renderPages();
  draw();
}
function draw() {
  const page = pages[active], {image} = page;
  const w = image.width, h = image.height;
  let transform;
  for (const canvas of [ui.before,ui.after]) {
    let ctx;
    if (canvas === ui.after) ctx = paint(canvas,page,w,h);
    else {
      canvas.width = w; canvas.height = h;
      ctx = canvas.getContext('2d');
      ctx.drawImage(image,0,0);
    }
    if (canvas === ui.after) {
      transform = ctx.getTransform();
      if (ui.mode.value === 'overlay') {
        ctx.setTransform(1,0,0,1,0,0);
        ctx.globalAlpha = Number(ui.opacity.value) / 100;
        ctx.drawImage(image,0,0);
        ctx.globalAlpha = 1;
      }
    }
    if (ui.guide.checked) {
      ctx.setTransform(1,0,0,1,0,0);
      ctx.strokeStyle = '#087ca5';
      ctx.setLineDash([6,4]);
      ctx.beginPath();
      for (let row = 1; row < 12; row++) {
        const y = row * h / 12;
        ctx.moveTo(0,y);
        ctx.lineTo(w,y);
      }
      ctx.stroke();
    }
  }
  ui.handles.width = w; ui.handles.height = h;
  edgeTransform = transform.inverse();
}
let edgeTransform;
function edgeDistances(event) {
  const {width:w,height:h} = ui.handles;
  const rect = ui.handles.getBoundingClientRect();
  const point = new DOMPoint((event.clientX-rect.left)*w/rect.width,(event.clientY-rect.top)*h/rect.height);
  const {x,y} = point.matrixTransform(edgeTransform);
  return [50+y*100/h,50-x*100/w,50-y*100/h,50+x*100/w];
}
ui.handles.onpointerdown = event => {
  if (!ui.editEdges.checked) return;
  const distances = edgeDistances(event);
  const errors = distances.map((distance,i) => Math.abs(distance-Math.max(0.6,pages[active].margins[i])));
  const distance = Math.min(...errors);
  if (distance > 5) return;
  drag = {edge:errors.indexOf(distance), pointer:event.pointerId};
  ui.handles.setPointerCapture(event.pointerId);
};
ui.handles.onpointermove = event => {
  if (drag?.pointer !== event.pointerId) return;
  const value = edgeDistances(event)[drag.edge];
  const page = pages[active];
  page.margins[drag.edge] = Math.round(Math.min(20,Math.max(0,value))*10)/10;
  marginInputs.forEach((input,i) => { input.value = orientedMargins(page)[i]; });
  draw();
};
ui.handles.onlostpointercapture = () => { if (drag) changed(); drag = null; };

function download(blob,name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url),60000);
}
ui.save.onclick = async () => {
  busy(true);
  const settings = pages.map(p => [p.angle,p.flip,ui.fit.checked,[...p.margins]]);
  try {
    if (isPdf) {
      ui.status.textContent = 'PDFを書き出しています…';
      const file = sources[0];
      download(await (await api('/export',file,settings)).blob(), file.name.replace(/\.pdf$/i,'-補正.pdf'));
    } else {
      if (!window.showDirectoryPicker) throw new Error('フォルダへの保存には Microsoft Edge または Google Chrome を使用してください。');
      const parent = await window.showDirectoryPicker({mode:'readwrite'});
      const name = path(sources[0]).split('/')[0] + '-補正-' + Date.now();
      const root = await parent.getDirectoryHandle(name,{create:true});
      for (const [i,file] of sources.entries()) {
        ui.status.textContent = '画像を保存中 ' + (i+1) + ' / ' + sources.length;
        const blob = await (await api('/export',file,[settings[i]])).blob();
        let dir = root;
        for (const name of path(file).split('/').slice(1,-1)) dir = await dir.getDirectoryHandle(name,{create:true});
        const handle = await dir.getFileHandle(file.name,{create:true});
        const writer = await handle.createWritable();
        await writer.write(blob); await writer.close();
      }
    }
    ui.status.textContent = '補正結果を書き出しました。';
  } catch (error) {
    ui.status.textContent = error.name === 'AbortError' ? '保存をキャンセルしました。' : error.message;
  } finally { busy(false); }
};
ui.pdf.onchange = () => load(Array.from(ui.pdf.files),true);
ui.cancelLoad.onclick = () => loading?.abort();
function isFileDrag(event) {
  return event.dataTransfer.types.includes('Files');
}
document.addEventListener('dragover', event => {
  if (!isFileDrag(event)) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = ui.pdf.disabled ? 'none' : 'copy';
  if (!ui.pdf.disabled) ui.dropZone.style.background = '#dcece3';
});
document.addEventListener('dragleave', event => {
  if (!event.relatedTarget) ui.dropZone.style.background = '';
});
document.addEventListener('drop', event => {
  if (!isFileDrag(event)) return;
  event.preventDefault();
  ui.dropZone.style.background = '';
  if (ui.pdf.disabled) return;
  const files = Array.from(event.dataTransfer.files);
  if (files.length !== 1 || extension(files[0]) !== '.pdf') {
    ui.status.textContent = 'PDFを1ファイルずつドロップしてください。画像は「画像フォルダを選ぶ」から開けます。';
    return;
  }
  load(files,true);
});
ui.folder.onchange = () => load(Array.from(ui.folder.files),false);
ui.angle.oninput = () => {
  if (ui.angle.value !== '' && ui.angle.validity.rangeOverflow === false && ui.angle.validity.rangeUnderflow === false) {
    pages[active].angle = ui.angle.valueAsNumber; changed();
  }
};
ui.angle.onchange = () => { ui.angle.value = pages[active].angle; };
ui.flip.onchange = () => { pages[active].flip = ui.flip.checked; changed(); select(active); };
ui.fit.onchange = () => {
  pages.forEach(page => { delete page.thumbnail; });
  renderPages(); draw();
};
marginInputs.forEach((input,i) => {
  input.oninput = () => {
    if (!Number.isFinite(input.valueAsNumber) || input.validity.rangeUnderflow || input.validity.rangeOverflow) return;
    const page = pages[active];
    page.margins[marginIndex(i,page)] = input.valueAsNumber;
    changed();
  };
  input.onchange = () => { input.value = orientedMargins(pages[active])[i]; };
});
ui.applyMargins.onclick = () => {
  if (!ready || !confirm('全ページ（' + pages.length + 'ページ）の白塗り幅を上書きしますか？')) return;
  const margins = orientedMargins(pages[active]);
  pages.forEach(page => {
    const next = margins.map((_,i) => margins[marginIndex(i,page)]);
    if (next.every((value,i) => value === page.margins[i])) return;
    page.margins = next; delete page.thumbnail;
  });
  renderPages();
};
ui.prev.onclick = () => select(nextIndex(-1));
ui.next.onclick = () => select(nextIndex(1));
ui.mode.onchange = () => {
  ui.views.dataset.mode = ui.mode.value;
  ui.opacityControl.hidden = ui.mode.value !== 'overlay';
  ui.caption.textContent = ui.mode.value === 'overlay' ? '重ねて比較' : '補正後';
  draw();
};
ui.opacity.oninput = draw;
ui.editEdges.onchange = () => {
  ui.handles.classList.toggle('editing',ui.editEdges.checked);
  ui.margins.hidden = !ui.editEdges.checked;
  draw();
};
function nudge(delta) {
  const page = pages[active];
  page.angle = Math.round(Math.min(15,Math.max(-15,page.angle + delta))*100)/100;
  ui.angle.value = page.angle;
  changed();
}
ui.less.onclick = () => nudge(-0.1);
ui.more.onclick = () => nudge(0.1);
ui.guide.onchange = draw;
ui.zoom.onchange = () => {
  const box = ui.comparison;
  const x = (box.scrollLeft + box.clientWidth/2) / ui.views.offsetWidth;
  const y = (box.scrollTop + box.clientHeight/2) / ui.views.offsetHeight;
  ui.views.style.width = Number(ui.zoom.value) * 100 + '%';
  box.scrollTo(x*ui.views.offsetWidth-box.clientWidth/2,y*ui.views.offsetHeight-box.clientHeight/2);
};
ui.reset.onclick = () => {
  pages[active].angle = pages[active].detected ?? 0;
  pages[active].flip = active % 2 === 1;
  pages[active].margins = [0,0,0,0];
  changed(); select(active);
};
ui.even.onclick = () => { pages.forEach((p,i) => {
  if (p.flip === (i % 2 === 1)) return;
  p.flip = i % 2 === 1; delete p.thumbnail;
}); select(active); };
ui.help.onclick = () => ui.shortcuts.showModal();
document.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.isComposing || event.ctrlKey || event.metaKey ||
      event.altKey || ui.shortcuts.open ||
      event.target.closest?.('input, select, textarea, [contenteditable]')) return;

  const key = event.key.toLowerCase();
  if (key === '?') {
    event.preventDefault();
    if (!event.repeat) ui.help.click();
    return;
  }
  if (!pages.length) return;

  const modes = ['after','split','overlay'];
  switch (key) {
    case 'arrowleft': ui.prev.click(); break;
    case 'arrowright': ui.next.click(); break;
    case '[': ui.less.click(); break;
    case ']': ui.more.click(); break;
    case 'r': if (!event.repeat) ui.flip.click(); break;
    case 'g': if (!event.repeat) ui.guide.click(); break;
    case 'm': if (!event.repeat) ui.editEdges.click(); break;
    case '1':
    case '2':
    case '3':
      ui.mode.value = modes[Number(key)-1];
      ui.mode.onchange();
      break;
    case '-':
    case '+':
      ui.zoom.selectedIndex = Math.max(0,Math.min(ui.zoom.length-1,
        ui.zoom.selectedIndex + (key === '+' ? 1 : -1)));
      ui.zoom.onchange();
      break;
    default: return;
  }
  event.preventDefault();
});
</script>
</html>
